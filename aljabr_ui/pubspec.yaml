name: aljabr
description: Modular IDE-style chat + code editor screen (Riverpod, no codegen).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  aljabr_plugin_api:
    path: ../packages/aljabr_plugin_api
  aljabr_plugin_runtime:
    path: ../packages/aljabr_plugin_runtime
  aljabr_coding_pack:
    path: ../packages/aljabr_coding_pack
  aljabr_coding_core:
    path: ../packages/aljabr_coding_core
  aljabr_plugin_chat:
    path: ../packages/aljabr_plugin_chat
  aljabr_plugin_editor:
    path: ../packages/aljabr_plugin_editor
  aljabr_plugin_diff:
    path: ../packages/aljabr_plugin_diff
  aljabr_plugin_mutations:
    path: ../packages/aljabr_plugin_mutations
  aljabr_plugin_agent_run:
    path: ../packages/aljabr_plugin_agent_run
  aljabr_plugin_terminal:
    path: ../packages/aljabr_plugin_terminal
  aljabr_plugin_project:
    path: ../packages/aljabr_plugin_project
  aljabr_extension:
    path: ../packages/aljabr_extension
  aljabr_workspace:
    path: ../packages/aljabr_workspace
  aljabr_knowledge:
    path: ../packages/aljabr_knowledge
  aljabr_platform:
    path: ../packages/aljabr_platform
  aljabr_sdk:
    path: ../packages/aljabr_sdk
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  objectbox: ^5.3.2
  objectbox_flutter_libs: any
  flutter_markdown: ^0.7.3
  flutter_math_fork: ^0.7.2
  flutter_riverpod: ^3.4.1
  desktop_drop: ^0.4.4
  file_picker: ^8.0.3
  gap: ^3.0.1
  grpc: ^5.1.0
  hive_flutter: ^1.1.0
  http: ^1.6.0
  markdown: ^7.2.1
  path_provider: ^2.1.6
  protobuf: ^6.0.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  fixnum: ^1.1.1
  google_fonts: ^8.2.1
  tenun: ^0.1.3
  uuid: ^4.6.0
  highlight: ^0.7.0
  flutter_code_editor: ^0.3.5

  riverpod: any
dev_dependencies:
  build_runner: any
  objectbox_generator: any
  flutter_launcher_icons: "^0.14.1"
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_gen_runner:
  mocktail: ^1.0.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/aljabr-logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/aljabr-logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/aljabr-logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/aljabr-logo.png"


flutter:
  generate: true
  uses-material-design: true

  assets:
  - assets/images/
  - assets/icons/
  - assets/audio/
  - assets/fonts/
  - assets/data/
  - pubspec.yaml
