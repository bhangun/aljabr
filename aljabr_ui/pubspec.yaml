name: aljabr
description: Modular IDE-style chat + code editor screen (Riverpod, no codegen).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  aljabr_plugin_api:
    path: ../packages/aljabr_plugin_api
  aljabr_plugin_runtime:
    path: ../packages/aljabr_plugin_runtime
  aljabr_extension:
    path: ../packages/aljabr_extension
  aljabr_governance:
    path: ../../../Pro/UI/packages/aljabr_governance
  aljabr_admin:
    path: ../../../Pro/UI/packages/aljabr_admin
  aljabr_analytics:
    path: ../../../Pro/UI/packages/aljabr_analytics
  aljabr_audit:
    path: ../../../Pro/UI/packages/aljabr_audit
  aljabr_collaboration:
    path: ../../../Pro/UI/packages/aljabr_collaboration
  aljabr_sdk:
    path: ../packages/aljabr_sdk
  flutter:
    sdk: flutter
  objectbox: ^5.3.2
  objectbox_flutter_libs: any
  flutter_markdown: ^0.7.3
  flutter_math_fork: ^0.7.2
  flutter_riverpod: ^3.4.1
  desktop_drop: ^0.4.4
  file_picker: ^8.0.3
  gap: ^3.0.1
  grpc: ^5.1.0
  hive_flutter: ^1.1.0
  http: ^1.6.0
  markdown: ^7.2.1
  path_provider: ^2.1.6
  protobuf: ^6.0.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  fixnum: ^1.1.1
  google_fonts: ^8.2.1
  tenun: ^0.1.3
  uuid: ^4.6.0
  highlight: ^0.7.0
  flutter_code_editor: ^0.3.5

  riverpod: any
dev_dependencies:
  build_runner: any
  objectbox_generator: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
