name: aljabr_plugin_chat
description: AI Coding Agent Chat, Composer, and Checkpoint plugin for Aljabr Workbench.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  flutter_markdown: ^0.7.3
  markdown: ^7.2.1
  flutter_math_fork: ^0.7.2
  hive_flutter: ^1.1.0
  desktop_drop: ^0.4.4
  file_picker: ^8.0.3
  url_launcher: ^6.3.2
  aljabr_plugin_api:
    path: ../aljabr_plugin_api
  aljabr_coding_core:
    path: ../aljabr_coding_core
  gap: ^3.0.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
