name: aljabr_coding_core
description: Core models, session providers, and backend client for Aljabr coding agent plugins.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  aljabr_plugin_api:
    path: ../aljabr_plugin_api
  grpc: ^5.1.0
  protobuf: ^6.0.0
  highlight: ^0.7.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  gap: ^3.0.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
