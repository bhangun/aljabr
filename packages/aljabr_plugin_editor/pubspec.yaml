name: aljabr_plugin_editor
description: Multi-tab syntax-highlighted code editor and workspace file explorer plugin for Aljabr.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  aljabr_plugin_api:
    path: ../aljabr_plugin_api
  aljabr_coding_core:
    path: ../aljabr_coding_core
  aljabr_plugin_diff:
    path: ../aljabr_plugin_diff
  aljabr_plugin_terminal:
    path: ../aljabr_plugin_terminal
  aljabr_plugin_mutations:
    path: ../aljabr_plugin_mutations
  flutter_code_editor: ^0.3.5
  highlight: ^0.7.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
