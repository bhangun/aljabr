syntax = "proto3";

package wayang;

option java_multiple_files = true;
option java_package = "tech.kayys.wayang.pro.api.grpc";
option java_outer_classname = "WayangProto";

// --- Models ---

message Project {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string base_path = 5;
  string metadata = 6;
  bool archived = 7;
}

message Session {
  string id = 1;
  string project_id = 2;
  string tenant_id = 3;
  string name = 4;
  string status = 5;
  string metadata = 6;
}

message ApiKey {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string key_prefix = 4;
  bool enabled = 5;
}

// --- Requests & Responses ---

message Empty {}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
  string base_path = 3;
}

message ListProjectsRequest {
  bool include_archived = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateSessionRequest {
  string project_id = 1;
  string name = 2;
}

message ListSessionsRequest {
  string project_id = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message ForkSessionRequest {
  string session_id = 1;
  string message_id = 2;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {
  bool success = 1;
}

message IndexWorkspaceRequest {
  string project_id = 1;
  string workspace_path = 2;
}

message IndexWorkspaceResponse {
  bool success = 1;
  int32 files_indexed = 2;
  int32 symbols_indexed = 3;
  int32 dependencies_indexed = 4;
  int64 duration_ms = 5;
  string repository_hash = 6;
  string error = 7;
}

message UpdateSessionStatusRequest {
  string session_id = 1;
  string status = 2;
}

message Task {
  string id = 1;
  string session_id = 2;
  string tenant_id = 3;
  string task_type = 4;
  string payload = 5;
  string status = 6;
  int32 priority = 7;
  int32 attempts = 8;
  int32 max_attempts = 9;
  string error = 10;
  string scheduled_at = 11;
  string started_at = 12;
  string completed_at = 13;
  string created_at = 14;
}

message CreateTaskRequest {
  string session_id = 1;
  string task_type = 2;
  string payload = 3;
  int32 priority = 4;
}

message ListTasksRequest {
  string session_id = 1;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message UpdateTaskStatusRequest {
  string task_id = 1;
  string status = 2;
  string error = 3;
}

message ChatMessage {
  string id = 1;
  string session_id = 2;
  string tenant_id = 3;
  string role = 4;
  string content = 5;
  string tool_calls = 6;
  int32 tokens = 7;
  string model = 8;
  string created_at = 9;
}

message ListChatMessagesRequest {
  string session_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListChatMessagesResponse {
  repeated ChatMessage messages = 1;
}

message AddChatMessageRequest {
  string session_id = 1;
  string role = 2;
  string content = 3;
  string tool_calls = 4;
  int32 tokens = 5;
  string model = 6;
}

message ObserveSessionRequest {
  string session_id = 1;
}

message CreateApiKeyRequest {
  string name = 1;
}

message CreateApiKeyResponse {
  ApiKey api_key = 1;
  string plain_text_key = 2; // Only sent once!
}

message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

// --- Services ---

service ProjectService {
  rpc CreateProject (CreateProjectRequest) returns (Project);
  rpc ListProjects (ListProjectsRequest) returns (ListProjectsResponse);
  
  rpc CreateSession (CreateSessionRequest) returns (Session);
  rpc ListSessions (ListSessionsRequest) returns (ListSessionsResponse);
  rpc ForkSession (ForkSessionRequest) returns (Session);
  rpc DeleteSession (DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc IndexWorkspace (IndexWorkspaceRequest) returns (IndexWorkspaceResponse);
  rpc UpdateSessionStatus (UpdateSessionStatusRequest) returns (Session);
}

service TaskService {
  rpc CreateTask (CreateTaskRequest) returns (Task);
  rpc ListTasks (ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTaskStatus (UpdateTaskStatusRequest) returns (Task);
}

service ApiKeyService {
  rpc CreateApiKey (CreateApiKeyRequest) returns (CreateApiKeyResponse);
  rpc ListApiKeys (Empty) returns (ListApiKeysResponse);
  rpc RevokeApiKey (ApiKey) returns (Empty);
}

message RunAgentRequest {
  string session_id = 1;
  string prompt = 2;
  string provider_id = 3;
  string model_id = 4;
  string workspace_path = 5;
  string agent_profile = 6;
}

message RunAgentEvent {
  string type = 1; // "TEXT", "TOOL_CALL", "TOOL_RESULT", "PLAN", "DONE"
  string content = 2;
  string payload = 3; // JSON payload for tools or plans
}

service ChatService {
  rpc ListMessages (ListChatMessagesRequest) returns (ListChatMessagesResponse);
  rpc AddMessage (AddChatMessageRequest) returns (ChatMessage);
  rpc ObserveSession (ObserveSessionRequest) returns (stream ChatMessage);
  rpc RunAgent (RunAgentRequest) returns (stream RunAgentEvent);
}

// --- SDK / Provider Discovery ---

message ProviderInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string capabilities = 4;
}

message ListProvidersResponse {
  repeated ProviderInfo providers = 1;
}

message ModelInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  string format = 4;
  int64 size_bytes = 5;
}

message ListModelsRequest {
  string provider_id = 1;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

service SdkService {
  rpc ListProviders (Empty) returns (ListProvidersResponse);
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
}
