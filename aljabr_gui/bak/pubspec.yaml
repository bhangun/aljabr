name: wayang_code
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.1
  diff_match_patch: ^0.4.1
  equatable: ^2.1.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.3.2
  google_fonts: ^8.1.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To avoid runtime fetching of Google Fonts on platforms with restricted
  # network permissions (e.g., macOS sandbox), add the TTF files for the
  # fonts used by the app here and run `flutter pub get`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

  # NOTE: Add the referenced TTF files under assets/fonts/ (not committed by me).
  # Example: assets/fonts/Inter-Regular.ttf
  # After placing the files, run: flutter pub get
